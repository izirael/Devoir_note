<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${client.id == null ? 'Ajout Client' : 'Edition Client'}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="mb-4" th:text="${client.id == null ? 'Nouveau Client' : 'Modifier Client'}"></h3>
                
                <form th:action="@{/clients/save}" th:object="${client}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="mb-3">
                        <label for="nom" class="form-label small text-muted text-uppercase fw-semibold">Nom complet</label>
                        <input type="text" th:field="*{nom}" class="form-control" id="nom" placeholder="Ex: Jean Dupont" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="contact" class="form-label small text-muted text-uppercase fw-semibold">Contact</label>
                        <input type="text" th:field="*{contact}" class="form-control" id="contact" placeholder="Email ou Téléphone" required>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/clients}" class="btn-minimal btn-outline-minimal">Annuler</a>
                        <button type="submit" class="btn-minimal btn-primary-minimal">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
