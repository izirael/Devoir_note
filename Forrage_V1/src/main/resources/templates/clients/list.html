<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Clients - Forrage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal active text-primary">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/statuts}" class="nav-link-minimal">Statuts</a>
            <a th:href="@{/demande-status}" class="nav-link-minimal">Demande Status</a>
            <a th:href="@{/devis}" class="nav-link-minimal">Devis</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Clients</h2>
        <a th:href="@{/clients/new}" class="btn-minimal btn-primary-minimal">Nouveau Client</a>
    </div>

    <div class="card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Contact</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client : ${clients}">
                    <td class="text-muted" th:text="${client.id}"></td>
                    <td class="fw-medium" th:text="${client.nom}"></td>
                    <td th:text="${client.contact}"></td>
                    <td class="text-end">
                        <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn-minimal btn-outline-minimal btn-sm me-2">Modifier</a>
                        <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="text-danger small text-decoration-none"
                           onclick="return confirm('Supprimer ce client ?')">Supprimer</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(clients)}" class="p-5 text-center text-muted">
            La liste des clients est vide.
        </div>
    </div>
</div>

</body>
</html>
