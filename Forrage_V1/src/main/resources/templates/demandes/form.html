<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${demande.id == null ? 'Nouvelle Demande' : 'Edition Demande'}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="mb-4" th:text="${demande.id == null ? 'Nouvelle Demande' : 'Modifier la Demande'}"></h3>
                
                <form th:action="@{/demandes/save}" th:object="${demande}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label small text-muted text-uppercase fw-semibold">Date</label>
                            <input type="date" th:field="*{date}" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="client" class="form-label small text-muted text-uppercase fw-semibold">Client</label>
                            <select th:field="*{client}" class="form-select" id="client" required>
                                <option value="">Choisir un client...</option>
                                <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="lieu" class="form-label small text-muted text-uppercase fw-semibold">Lieu d'intervention</label>
                        <input type="text" th:field="*{lieu}" class="form-control" id="lieu" placeholder="Adresse précise" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="district" class="form-label small text-muted text-uppercase fw-semibold">District</label>
                        <input type="text" th:field="*{district}" class="form-control" id="district" placeholder="District concerné" required>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/demandes}" class="btn-minimal btn-outline-minimal">Annuler</a>
                        <button type="submit" class="btn-minimal btn-primary-minimal">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
