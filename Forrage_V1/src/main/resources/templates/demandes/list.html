<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Demandes - Forrage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal active text-primary">Demandes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Demandes d'intervention</h2>
        <a th:href="@{/demandes/new}" class="btn-minimal btn-primary-minimal">Nouvelle Demande</a>
    </div>

    <div class="card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Lieu</th>
                    <th>District</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="demande : ${demandes}">
                    <td class="text-muted" th:text="${demande.date}"></td>
                    <td class="fw-medium" th:text="${demande.client != null ? demande.client.nom : 'Non assigné'}"></td>
                    <td th:text="${demande.lieu}"></td>
                    <td th:text="${demande.district}"></td>
                    <td class="text-end">
                        <a th:href="@{/demandes/edit/{id}(id=${demande.id})}" class="btn-minimal btn-outline-minimal btn-sm me-2">Modifier</a>
                        <a th:href="@{/demandes/delete/{id}(id=${demande.id})}" class="text-danger small text-decoration-none"
                           onclick="return confirm('Supprimer cette demande ?')">Supprimer</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(demandes)}" class="p-5 text-center text-muted">
            Aucune demande en cours.
        </div>
    </div>
</div>

</body>
</html>
