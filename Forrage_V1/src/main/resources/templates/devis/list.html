<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Devis - Forrage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/devis}" class="nav-link-minimal active text-primary">Devis list</a>
            <a th:href="@{/devis/calculator}" class="nav-link-minimal">Nouveau Devis (Calc)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Liste des Devis</h2>
        <a th:href="@{/devis/calculator}" class="btn-minimal btn-primary-minimal">
            + Nouveau Devis
        </a>
    </div>

    <div class="card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Libellé</th>
                    <th>Client</th>
                    <th>Type</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="devis : ${devisList}">
                    <td class="text-muted" th:text="${devis.date}"></td>
                    <td class="fw-bold text-primary" th:text="${devis.libelle}"></td>
                    <td class="fw-medium" th:text="${devis.demande != null and devis.demande.client != null ? devis.demande.client.nom : 'N/A'}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${devis.typeDevis != null ? devis.typeDevis.nom : 'N/A'}"></span>
                    </td>
                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(devis.montant, 1, 'POINT', 2, 'COMMA')} + ' AR'"></td>
                    <td class="text-end">
                        <span class="badge bg-secondary" th:text="${devis.statut != null ? devis.statut.nom : 'En attente'}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(devisList)}" class="p-5 text-center text-muted">
            Aucun devis enregistré.
        </div>
    </div>
    
    <div class="mt-4">
        <a th:href="@{/demandes}" class="btn-minimal btn-outline-minimal">Retour aux demandes</a>
    </div>
</div>

</body>
</html>
