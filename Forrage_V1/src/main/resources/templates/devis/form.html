<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Devis - Forrage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/devis}" class="nav-link-minimal">Devis</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="mb-4">Création de Devis</h3>
                
                <div class="alert alert-info border-0 shadow-sm mb-4">
                    <strong>Demande :</strong> 
                    <span th:text="${demande.client.nom}"></span> - 
                    <span th:text="${demande.lieu}"></span>
                </div>

                <form th:action="@{/devis/save}" th:object="${devis}" method="post">
                    <input type="hidden" name="demande" th:value="${demande.id}" />
                    
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label small text-muted text-uppercase fw-semibold">Date du Devis</label>
                            <input type="date" th:field="*{date}" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="typeDevis" class="form-label small text-muted text-uppercase fw-semibold">Type de Devis</label>
                            <select th:field="*{typeDevis}" class="form-select" id="typeDevis" required>
                                <option value="">Choisir un type...</option>
                                <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.nom}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="libelle" class="form-label small text-muted text-uppercase fw-semibold">Libellé / Description</label>
                        <input type="text" th:field="*{libelle}" class="form-control" id="libelle" placeholder="Ex: Devis pour forage Sud" required>
                    </div>

                    <div class="mb-4">
                        <label for="montant" class="form-label small text-muted text-uppercase fw-semibold">Montant Total Estimé</label>
                        <div class="input-group">
                            <input type="number" step="0.01" th:field="*{montant}" class="form-control" id="montant" placeholder="0.00" required>
                            <span class="input-group-text">AR</span>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/demandes}" class="btn-minimal btn-outline-minimal">Annuler</a>
                        <button type="submit" class="btn-minimal btn-primary-minimal">Enregistrer le Devis</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Set today as default date
    document.getElementById('date').valueAsDate = new Date();
</script>

</body>
</html>
