<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Statuts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/statuts}" class="nav-link-minimal active text-primary">Statuts</a>
            <a th:href="@{/demande-status}" class="nav-link-minimal">Demande Status</a>
            <a th:href="@{/devis}" class="nav-link-minimal">Devis</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 th:text="${statut.id == null ? 'Nouveau Statut' : 'Modifier Statut'}"></h3>
                <form th:action="@{/statuts/save}" th:object="${statut}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    <div class="mb-3">
                        <label for="nom" class="form-label text-muted text-uppercase small fw-bold">Nom du statut</label>
                        <input type="text" th:field="*{nom}" class="form-control" id="nom" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-minimal btn-primary-minimal">Enregistrer</button>
                        <a th:if="${statut.id != null}" th:href="@{/statuts}" class="btn-minimal btn-outline-minimal">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="col-md-7">
            <div class="card p-0 overflow-hidden">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${statuts}">
                            <td class="fw-medium" th:text="${s.nom}"></td>
                            <td class="text-end">
                                <a th:href="@{/statuts/edit/{id}(id=${s.id})}" class="btn-minimal btn-outline-minimal btn-sm me-2">Modifier</a>
                                <a th:href="@{/statuts/delete/{id}(id=${s.id})}" class="text-danger small text-decoration-none" onclick="return confirm('Supprimer ce statut ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
