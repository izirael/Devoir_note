<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suivi Global des Demandes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/statuts}" class="nav-link-minimal">Statuts</a>
            <a th:href="@{/demande-status}" class="nav-link-minimal active text-primary">Demande Status</a>
            <a th:href="@{/devis}" class="nav-link-minimal">Devis</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Liste des Statuts de Demandes</h2>
    <div class="card p-0 overflow-hidden">
        <table class="table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Demande ID</th>
                    <th>Client</th>
                    <th>Statut</th>
                    <th>Observation</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${statuses}">
                    <td th:text="${s.date}"></td>
                    <td th:text="${s.demande.id}"></td>
                    <td th:text="${s.demande.client != null ? s.demande.client.nom : 'N/A'}"></td>
                    <td>
                        <span class="badge" 
                              th:classappend="${s.statut.nom == 'fait' ? 'bg-success' : 'bg-primary'}"
                              th:text="${s.statut.nom}"></span>
                    </td>
                    <td class="small text-muted" th:text="${s.observation}"></td>
                    <td class="text-end">
                        <a th:href="@{/demandes/{id}/status(id=${s.demande.id})}" class="btn-minimal btn-outline-minimal btn-sm">Détails</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(statuses)}" class="p-5 text-center text-muted">
            Aucun statut enregistré.
        </div>
    </div>
</div>

</body>
</html>
