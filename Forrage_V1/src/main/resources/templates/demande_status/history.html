<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des Statuts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="brand-text">FORRAGE</a>
        <div class="d-flex">
            <a th:href="@{/clients}" class="nav-link-minimal">Clients</a>
            <a th:href="@{/demandes}" class="nav-link-minimal">Demandes</a>
            <a th:href="@{/statuts}" class="nav-link-minimal">Statuts</a>
            <a th:href="@{/demande-status}" class="nav-link-minimal">Demande Status</a>
            <a th:href="@{/devis}" class="nav-link-minimal">Devis</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h3>Nouvelle Mise à Jour</h3>
                <form th:action="@{/demande-status/save}" th:object="${newStatus}" method="post">
                    <input type="hidden" th:field="*{demande.id}" />
                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Date</label>
                        <input type="date" th:field="*{date}" class="form-control" required th:value="${T(java.time.LocalDate).now()}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Nouveau Statut</label>
                        <select th:field="*{statut}" class="form-select" required>
                            <option value="">Choisir...</option>
                            <option th:each="st : ${availableStatuts}" th:value="${st.id}" th:text="${st.nom}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted text-uppercase small fw-bold">Observation</label>
                        <textarea th:field="*{observation}" class="form-control" rows="2" placeholder="Note facultative..."></textarea>
                    </div>
                    <button type="submit" class="btn-minimal btn-primary-minimal w-100">Ajouter</button>
                </form>
                
                <hr class="my-4">
                
                <h5 class="text-muted text-uppercase small fw-bold mb-3">Détails Demande</h5>
                <p><strong>ID:</strong> <span th:text="${demande.id}"></span></p>
                <p><strong>Client:</strong> <span th:text="${demande.client.nom}"></span></p>
                <p><strong>Lieu:</strong> <span th:text="${demande.lieu}"></span></p>
            </div>
        </div>
        
<div class="col-md-8">
            <div class="card p-4 border-0 shadow-sm">
                <h3 class="mb-4">Historique des Étapes</h3>
                
                <div class="position-relative ps-4 border-start border-2 ms-2 mt-4" style="border-color: #e9ecef !important;">
                    <div th:each="s : ${statuses}" class="mb-4 position-relative">
                        <!-- Custom dot for the timeline -->
                        <div class="position-absolute rounded-circle bg-white border border-3 border-primary" 
                             style="width: 16px; height: 16px; left: -29px; top: 4px;"></div>
                        
                        <div class="p-3 rounded-3 shadow-sm border" th:classappend="${s.statut.nom.toLowerCase().contains('fait') ? 'border-success-subtle bg-success-light' : 'border-light bg-white'}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="small text-muted d-block" th:text="${#temporals.format(s.date, 'dd MMM yyyy')}"></span>
                                    <span class="fw-bold fs-5" th:text="${s.statut.nom}"></span>
                                    <p th:if="${s.observation != null and !s.observation.isEmpty()}" class="mt-2 mb-0 text-muted small italic" th:text="${s.observation}"></p>
                                </div>
                                <div class="d-flex align-items-center">
                                    <a th:href="@{/demande-status/delete/{id}(id=${s.id})}" class="btn btn-sm btn-link text-danger text-decoration-none p-0 px-2" 
                                       onclick="return confirm('Supprimer cet événement ?')">
                                        Effacer
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(statuses)}" class="text-center py-5">
                        <p class="text-muted mb-0">Aucun historique disponible pour cette demande.</p>
                        <small>Utilisez le formulaire à gauche pour ajouter une étape.</small>
                    </div>
                </div>
                
                <div class="mt-4 border-top pt-3 text-end">
                    <a th:href="@{/demandes}" class="btn-minimal btn-outline-minimal">Retour à la liste</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
